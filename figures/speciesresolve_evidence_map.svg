<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="940" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
  <title id="title">SpeciesResolve evidence map</title>
  <desc id="desc">Conceptual map for microbial species delineation using genome quality, ANI and alignment fraction, GTDB context, dRep clustering, and phylogenomic context.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1"><stop offset="0" stop-color="#133b5c"/><stop offset="1" stop-color="#315d8f"/></linearGradient>
    <linearGradient id="softblue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eef6ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="softgreen" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#edf8f1"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="softamber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff7e8"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <linearGradient id="softviolet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5f1ff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0c2134" flood-opacity="0.10"/></filter>
    <style>
      .t{font-family:system-ui,-apple-system,Segoe UI,sans-serif;fill:#18344b}
      .title{font-size:51px;font-weight:760}
      .sub{font-size:21px;fill:#e7f2fa}
      .h{font-size:24px;font-weight:730}
      .b{font-size:18px;fill:#456171}
      .s{font-size:15px;fill:#667c89}
      .label{font-size:16px;font-weight:720;letter-spacing:.7px;fill:#315d8f}
      .axis{stroke:#738493;stroke-width:2}
      .grid{stroke:#e5ebf0;stroke-width:1}
    </style>
  </defs>

  <rect width="1600" height="940" rx="30" fill="#fbfcfe"/>
  <rect x="38" y="34" width="1524" height="116" rx="28" fill="url(#header)"/>
  <circle cx="105" cy="92" r="39" fill="#ffffff" opacity="0.97"/>
  <circle cx="90" cy="92" r="11" fill="#3d79b5"/>
  <circle cx="120" cy="92" r="11" fill="#4ca173"/>
  <path d="M101 92 H109" stroke="#18344b" stroke-width="4" stroke-linecap="round"/>
  <text x="170" y="92" class="t title" fill="#ffffff">SpeciesResolve</text>
  <text x="171" y="124" class="t sub">Microbial species delineation by evidence concordance, not one cutoff</text>

  <text x="64" y="198" class="t label">START WITH THE GENOMES</text>

  <g filter="url(#shadow)"><rect x="60" y="222" width="330" height="230" rx="24" fill="url(#softblue)" stroke="#c8dceb" stroke-width="2"/></g>
  <text x="92" y="266" class="t h">Genome quality</text>
  <text x="92" y="302" class="t b">Can these assemblies support</text>
  <text x="92" y="328" class="t b">species-level comparison?</text>
  <text x="92" y="370" class="t s">Completeness</text>
  <text x="225" y="370" class="t s">Contamination</text>
  <text x="92" y="400" class="t s">Assembly size</text>
  <text x="225" y="400" class="t s">Contig count / N50</text>
  <rect x="92" y="420" width="238" height="8" rx="4" fill="#d6e3ec"/>
  <rect x="92" y="420" width="192" height="8" rx="4" fill="#3d79b5"/>

  <g filter="url(#shadow)"><rect x="425" y="222" width="500" height="392" rx="24" fill="#ffffff" stroke="#d3dde5" stroke-width="2"/></g>
  <text x="458" y="266" class="t h">ANI + alignment fraction</text>
  <text x="458" y="297" class="t b">Identity and genome overlap belong together</text>
  <g transform="translate(482,340)">
    <line x1="0" y1="220" x2="380" y2="220" class="axis"/>
    <line x1="0" y1="220" x2="0" y2="0" class="axis"/>
    <g class="grid"><line x1="0" y1="165" x2="380" y2="165"/><line x1="0" y1="110" x2="380" y2="110"/><line x1="0" y1="55" x2="380" y2="55"/><line x1="95" y1="0" x2="95" y2="220"/><line x1="190" y1="0" x2="190" y2="220"/><line x1="285" y1="0" x2="285" y2="220"/></g>
    <line x1="285" y1="0" x2="285" y2="220" stroke="#c07a22" stroke-width="2" stroke-dasharray="8 7"/>
    <line x1="0" y1="110" x2="380" y2="110" stroke="#4b8f68" stroke-width="2" stroke-dasharray="8 7"/>
    <circle cx="334" cy="43" r="11" fill="#3f9a6b"/>
    <circle cx="306" cy="84" r="11" fill="#76ad59"/>
    <circle cx="283" cy="119" r="11" fill="#d89a2e"/>
    <circle cx="244" cy="151" r="11" fill="#d87555"/>
    <circle cx="70" cy="194" r="11" fill="#9aa8b2"/>
    <text x="259" y="239" class="t s">ANI (%)</text>
    <text x="-160" y="-21" transform="rotate(-90)" class="t s">alignment fraction</text>
    <text x="291" y="17" class="t s" fill="#a56716">95% reference</text>
    <text x="10" y="102" class="t s" fill="#3e805a">0.5 context line</text>
  </g>
  <text x="458" y="594" class="t s">Toy points shown for interpretation only. Missing FastANI output stays missing.</text>

  <g filter="url(#shadow)"><rect x="960" y="222" width="574" height="230" rx="24" fill="url(#softviolet)" stroke="#d8cdee" stroke-width="2"/></g>
  <text x="992" y="266" class="t h">GTDB context</text>
  <text x="992" y="302" class="t b">Reference ANI screen + marker-gene placement</text>
  <text x="992" y="344" class="t s">Species-specific representative radius</text>
  <text x="992" y="374" class="t s">Alignment-fraction requirement</text>
  <text x="992" y="404" class="t s">GTDB release and representative genome</text>
  <path d="M1372 306 C1416 342 1416 383 1372 414 C1328 383 1328 342 1372 306Z" fill="#e5dcf8" stroke="#7455a6" stroke-width="3"/>
  <circle cx="1372" cy="361" r="11" fill="#7455a6"/>

  <text x="64" y="508" class="t label">CONTEXT AND OPERATIONAL TOOLS</text>

  <g filter="url(#shadow)"><rect x="60" y="536" width="330" height="228" rx="24" fill="url(#softamber)" stroke="#ecd7aa" stroke-width="2"/></g>
  <text x="92" y="580" class="t h">dRep clustering</text>
  <text x="92" y="616" class="t b">Useful for grouping many genomes</text>
  <text x="92" y="642" class="t b">and choosing representatives.</text>
  <text x="92" y="684" class="t s">Threshold-dependent</text>
  <text x="92" y="714" class="t s">Not an independent species test</text>
  <g transform="translate(275,677)"><circle cx="0" cy="0" r="13" fill="#d89a2e"/><circle cx="35" cy="-18" r="13" fill="#d89a2e"/><circle cx="45" cy="22" r="13" fill="#d89a2e"/><circle cx="88" cy="2" r="15" fill="#3d79b5"/></g>

  <g filter="url(#shadow)"><rect x="425" y="648" width="500" height="116" rx="24" fill="url(#softgreen)" stroke="#c4dfce" stroke-width="2"/></g>
  <text x="458" y="690" class="t h">Optional method cross-check</text>
  <text x="458" y="723" class="t b">pyani can compare selected pairs with another ANI algorithm.</text>
  <text x="458" y="748" class="t s">Method agreement is useful, but it is not a second biological vote.</text>

  <g filter="url(#shadow)"><rect x="960" y="492" width="574" height="272" rx="24" fill="url(#softgreen)" stroke="#c4dfce" stroke-width="2"/></g>
  <text x="992" y="536" class="t h">Phylogenomic context</text>
  <text x="992" y="572" class="t b">Does the proposed grouping agree with</text>
  <text x="992" y="598" class="t b">marker-gene or core-genome relationships?</text>
  <path d="M1040 704 V626 M1040 646 H1090 M1090 646 V620 M1090 646 V676 M1040 684 H1142 M1142 684 V654 M1142 684 V716 M1142 654 H1190 M1190 654 V632 M1190 654 V674" fill="none" stroke="#4b8f68" stroke-width="4" stroke-linecap="round"/>
  <circle cx="1090" cy="620" r="7" fill="#4b8f68"/><circle cx="1090" cy="676" r="7" fill="#4b8f68"/><circle cx="1190" cy="632" r="7" fill="#4b8f68"/><circle cx="1190" cy="674" r="7" fill="#4b8f68"/><circle cx="1142" cy="716" r="7" fill="#4b8f68"/>
  <text x="1246" y="648" class="t s">Especially useful when</text>
  <text x="1246" y="674" class="t s">ANI and taxonomy disagree.</text>

  <text x="64" y="822" class="t label">INTERPRET THE CONCORDANCE</text>
  <rect x="60" y="846" width="1474" height="58" rx="18" fill="#18344b"/>
  <text x="102" y="882" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" fill="#dff1e7">CONCORDANT SUPPORT</text>
  <text x="514" y="882" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" fill="#ffe8b3">DISCORDANT EVIDENCE</text>
  <text x="1010" y="882" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" fill="#d8e9f8">UNRESOLVED</text>
  <text x="1310" y="882" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" fill="#bcd0df">No automatic taxonomic act</text>
</svg>
